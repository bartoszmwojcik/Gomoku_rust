[package]
name = "gomoku-db"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dotenvy = "0.15.7"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "tls-rustls", "uuid", "time"] }
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["rt", "macros", "sync", "time", "rt-multi-thread"] }
uuid = { version = "1.29.3", features = ["v4", "serde"] }

[lints]
workspace = true

[dev-dependencies]
testcontainers = "0.27"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
