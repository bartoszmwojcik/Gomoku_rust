[package]
name = "gomoku-web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
askama = "0.16.1"
async-trait = "0.1.92"
axum = "0.8.9"
dotenvy = "0.15.7"
gomoku-core = { version = "0.1.0", path = "../gomoku-core" }
gomoku-db = { version = "0.1.0", path = "../gomoku-db" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "net"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true

[dev-dependencies]
http-body-util = "0.1.5"
tower = "0.5.3"
