[package]
name = "gomoku-web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
argon2 = "0.6.0"
askama = "0.16.1"
async-trait = "0.1.92"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.23.1"
dotenvy = "0.15.7"
gomoku-core = { version = "0.1.0", path = "../gomoku-core" }
gomoku-db = { version = "0.1.0", path = "../gomoku-db" }
qrcode = { version = "0.15.0", default-features = false, features = ["svg"] }
rand = "0.10.4"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
rmcp = { version = "=3.11.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
rpassword = "7.5.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "net", "sync", "time"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true

[dev-dependencies]
http-body-util = "0.1.5"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres"] }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
tower = "0.5.3"
