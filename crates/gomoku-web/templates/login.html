{% extends "layout.html" %}
{% block title %}{{ ctx.tr.t("login.title") }} · {{ ctx.tr.t("app.name") }}{% endblock %}
{% block content %}
<h1>{{ ctx.tr.t("login.title") }}</h1>
<form data-api="/api/auth/login" data-redirect="{{ next }}" data-testid="login-form" novalidate>
  <p data-form-error role="alert" data-testid="form-error"></p>
  <label>{{ ctx.tr.t("login.email") }}
    <input type="email" name="email" required autocomplete="email" data-testid="email">
  </label>
  <p data-error-for="email" role="alert"></p>
  <label>{{ ctx.tr.t("login.password") }}
    <input type="password" name="password" required autocomplete="current-password" data-testid="password">
  </label>
  <p data-error-for="password" role="alert"></p>
  <button type="submit" data-testid="submit">{{ ctx.tr.t("login.submit") }}</button>
</form>
<p>{{ ctx.tr.t("login.noAccount") }} <a href="/register?next={{ next|urlencode }}">{{ ctx.tr.t("login.registerLink") }}</a></p>
{% endblock %}
