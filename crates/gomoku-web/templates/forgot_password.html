{% extends "layout.html" %}
{% block title %}{{ ctx.tr.t("forgot.title") }} · {{ ctx.tr.t("app.name") }}{% endblock %}
{% block content %}
<h1>{{ ctx.tr.t("forgot.title") }}</h1>
<p>{{ ctx.tr.t("forgot.lead") }}</p>
<form data-api="/api/auth/password-reset/request" data-success="#forgot-sent" data-hide-on-success data-testid="forgot-form" novalidate>
  <p data-form-error role="alert" data-testid="form-error"></p>
  <label>{{ ctx.tr.t("login.email") }}
    <input type="email" name="email" required autocomplete="email" data-testid="email">
  </label>
  <p data-error-for="email" role="alert"></p>
  <button type="submit" data-testid="submit">{{ ctx.tr.t("forgot.submit") }}</button>
</form>
<p id="forgot-sent" hidden role="status" data-testid="forgot-sent">{{ ctx.tr.t("forgot.sent") }}</p>
<p><a href="/login">{{ ctx.tr.t("forgot.backToLogin") }}</a></p>
{% endblock %}
