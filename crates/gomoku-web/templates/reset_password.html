{% extends "layout.html" %}
{% block title %}{{ ctx.tr.t("reset.title") }} · {{ ctx.tr.t("app.name") }}{% endblock %}
{% block content %}
<h1>{{ ctx.tr.t("reset.title") }}</h1>
<form data-api="/api/auth/password-reset/confirm" data-success="#reset-done" data-hide-on-success data-testid="reset-form" novalidate>
  <p data-form-error role="alert" data-testid="form-error"></p>
  <input type="hidden" name="token" value="{{ token }}">
  <p data-error-for="token" role="alert"></p>
  <label>{{ ctx.tr.t("reset.newPassword") }}
    <input type="password" name="newPassword" required autocomplete="new-password" minlength="8" data-testid="new-password">
  </label>
  <small>{{ ctx.tr.t("register.passwordHint") }}</small>
  <p data-error-for="newPassword" role="alert"></p>
  <button type="submit" data-testid="submit">{{ ctx.tr.t("reset.submit") }}</button>
</form>
<p id="reset-done" hidden role="status" data-testid="reset-done">{{ ctx.tr.t("reset.done") }} <a href="/login">{{ ctx.tr.t("nav.login") }}</a></p>
{% endblock %}
